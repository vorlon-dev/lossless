# ─── Antra Flux — Cloudflare Workers configuration ───────────────────────────
# One free Workers project = static site (out/) + public /api/* endpoints.
#   • Static asset requests: unlimited, free
#   • Worker runs ONLY for /api/*: 100k requests/day free
#
# Local CLI:    bash scripts/export-static.sh && npx wrangler deploy
# Git (CI):     Workers Builds → Build command: bash scripts/export-static.sh
#               Deploy command: npx wrangler deploy   (the default)
#
# NOTE: this is a Workers-style wrangler.toml. `wrangler pages deploy` is NOT
# needed anymore — `npx wrangler deploy` is the one and only deploy command.

name = "antra-flux"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

# Non-secret vars (override in dashboard → your Worker → Settings → Variables
# and Secrets; secrets: `npx wrangler secret put ANTRA_GATEWAY_URL`)
[vars]
# Metadata backend (defaults to the built-in YTM worker if unset):
# ANTRA_GATEWAY_URL = "https://ytm-backend.vorlon-revora.workers.dev"
# Playback resolver — set to enable /api/stream/{id} (302 redirect, {id} = video id):
# ANTRA_STREAM_TEMPLATE = "https://your-resolver.example/stream/{id}"
# ANTRA_API_KEY = ""
